name: Scheduled publish

# Rebuilds the site daily so articles whose pubDate has arrived go live.
# Future-dated posts are filtered out at build time in src/lib/blog.ts.
on:
  schedule:
    # 16:00 UTC = 09:00 Vancouver (PDT). Articles dated <= today publish.
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  trigger-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out IndexNow automation
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Capture currently published pages
        run: |
          if ! curl -fsS \
            "https://www.kuipra.ca/indexnow-manifest.json?before=${GITHUB_RUN_ID}" \
            -o "$RUNNER_TEMP/indexnow-before.json"; then
            printf '{"pages":{}}\n' > "$RUNNER_TEMP/indexnow-before.json"
          fi

      - name: Trigger Vercel production rebuild
        run: curl -sf -X POST "$DEPLOY_HOOK" > /dev/null
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}

      - name: Wait for the scheduled deploy
        run: |
          node scripts/wait-for-indexnow-manifest.mjs \
            --after "$RUNNER_TEMP/indexnow-before.json" \
            --output "$RUNNER_TEMP/indexnow-after.json"

      - name: Notify IndexNow about newly published pages
        run: |
          node scripts/submit-indexnow.mjs \
            --before "$RUNNER_TEMP/indexnow-before.json" \
            --after "$RUNNER_TEMP/indexnow-after.json"
