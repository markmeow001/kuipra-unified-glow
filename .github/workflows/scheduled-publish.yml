name: Scheduled publish

# Rebuilds the site daily so articles whose pubDate has arrived go live.
# Future-dated posts are filtered out at build time in src/lib/blog.ts.
on:
  schedule:
    # 16:00 UTC = 09:00 Vancouver (PDT). Articles dated <= today publish.
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  trigger-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel production rebuild
        run: curl -sf -X POST "$DEPLOY_HOOK" > /dev/null
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
