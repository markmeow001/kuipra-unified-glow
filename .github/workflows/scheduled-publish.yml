name: Scheduled publish

# Rebuilds the site daily so articles whose pubDate has arrived go live.
# Future-dated posts are filtered out at build time in src/lib/blog.ts.
on:
  schedule:
    # 16:00 UTC = 09:00 Vancouver (PDT). Articles dated <= today publish.
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  trigger-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel production rebuild
        run: curl -sf -X POST "$DEPLOY_HOOK" > /dev/null
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
      - name: Wait for deploy to propagate
        run: sleep 120
      - name: Ping IndexNow with current sitemap URLs
        run: |
          python3 - <<'EOF'
          import json, re, urllib.request
          urls = re.findall(r'<loc>(.*?)</loc>', urllib.request.urlopen(
              'https://www.kuipra.ca/sitemap-0.xml').read().decode())
          body = json.dumps({
              "host": "www.kuipra.ca",
              "key": "024ff10d9fc2f015db0a18a17089de45",
              "keyLocation": "https://www.kuipra.ca/024ff10d9fc2f015db0a18a17089de45.txt",
              "urlList": urls,
          }).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow",
              data=body, headers={"Content-Type": "application/json; charset=utf-8"})
          print("IndexNow:", urllib.request.urlopen(req, timeout=30).status)
          EOF
